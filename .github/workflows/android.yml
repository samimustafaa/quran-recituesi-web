name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-app]
permissions:
  contents: write
jobs:
  build:
    concurrency:
      group: android-update-channel
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: .android-cache
          key: quran-qcf-v2-74eb4e20f4e78cc11c055a3e130136e8dbb7743e
      - run: npm ci
      - run: npm run android:update:check
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - run: npm run android:update
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-android-update
          path: build/android-update/
          if-no-files-found: error
      - name: Publish verified Android update
        if: github.ref == 'refs/heads/feature/android-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-update.mjs
